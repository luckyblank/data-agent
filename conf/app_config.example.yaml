# Copy to app_config.yaml and fill in your own local credentials.
logging:
  file:
    enable: true
    level: INFO
    path: logs/app.log
    rotation: 10 MB
    retention: 7 days
  console:
    enable: true
    level: INFO

db_meta:
  host: localhost
  port: 3307
  user: atguigu
  password: CHANGE_ME
  database: meta

db_dw:
  host: localhost
  port: 3307
  user: atguigu
  password: CHANGE_ME
  database: dw

qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

embedding:
  host: localhost
  port: 8081
  model: bge-large-zh-v1.5

es:
  host: localhost
  port: 9200
  index_name: column_value

llm:
  model_name: YOUR_MODEL_NAME
  api_key: YOUR_API_KEY
  base_url: YOUR_PROVIDER_BASE_URL
